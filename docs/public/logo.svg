<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="vue3-modal logo">
  <!--
    Flat, minimal mark for VitePress header + favicon.
    Colors: Vue green, dark gray, white. No gradients/shadows.
  -->

  <!-- Overlay (semi-transparent line) -->
  <rect
    x="56"
    y="56"
    width="400"
    height="400"
    rx="72"
    fill="none"
    stroke="#1f2937"
    stroke-width="20"
    opacity="0.22"
  />

  <!-- Modal window -->
  <rect
    x="112"
    y="124"
    width="288"
    height="264"
    rx="56"
    fill="#ffffff"
    stroke="#1f2937"
    stroke-width="22"
  />

  <!-- Modal header divider -->
  <line
    x1="140"
    y1="200"
    x2="372"
    y2="200"
    stroke="#1f2937"
    stroke-width="18"
    stroke-linecap="round"
    opacity="0.28"
  />

  <!-- Abstract V (Vue ecosystem) -->
  <path
    d="M182 238 L256 340 L330 238"
    fill="none"
    stroke="#42b883"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Small close dot (minimal hint, not decorative) -->
  <circle cx="360" cy="168" r="10" fill="#42b883" />
</svg>
